services:
  casdoor:
    image: ${CASDOOR_IMAGE:-casbin/casdoor:${CASDOOR_VERSION:-3.164.0}}
    restart: unless-stopped
    command: ["--createDatabase=true"]
    environment:
      appname: casdoor
      httpport: "8000"
      runmode: prod
      driverName: mysql
      dataSourceName: "${MYSQL_APP_USER}:${MYSQL_APP_PASSWORD}@tcp(${MYSQL_HOST}:${MYSQL_PORT:-3306})/"
      dbName: "${MYSQL_DATABASE}"
      showSql: "false"
      origin: "${CASDOOR_ORIGIN}"
      originFrontend: "${CASDOOR_ORIGIN}"
      enableGzip: "true"
    ports:
      - "${CASDOOR_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - casdoor_logs:/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  casdoor_logs:
