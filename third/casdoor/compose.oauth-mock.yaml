services:
  oauth-mock:
    image: alpine:3.22.5@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    restart: unless-stopped
    ports:
      - "${OAUTH_MOCK_PORT:-9000}:8080"
    environment:
      PORT: "8080"
      ISSUER: "http://127.0.0.1:${OAUTH_MOCK_PORT:-9000}"
      SCAN_BASE_URL: "${OAUTH_MOCK_SCAN_BASE_URL:-http://127.0.0.1:${OAUTH_MOCK_PORT:-9000}}"
      CLIENT_ID: casdoor-mock-client
      CLIENT_SECRET: casdoor-mock-secret
      ALLOWED_REDIRECT_URIS: "http://127.0.0.1:8000/callback,http://127.0.0.1:8001/callback,http://localhost:8000/callback,http://localhost:8001/callback"
      MOCK_USER_EMAIL: alice@mock.wecom.local
      MOCK_USER_NAME: alice
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        case "$$(uname -m)" in
          x86_64) binary=/opt/oauth-mock-linux-amd64 ;;
          aarch64) binary=/opt/oauth-mock-linux-arm64 ;;
          *) echo "unsupported architecture: $$(uname -m)" >&2; exit 1 ;;
        esac
        exec "$$binary"
    configs:
      - source: oauth_mock_linux_amd64
        target: /opt/oauth-mock-linux-amd64
      - source: oauth_mock_linux_arm64
        target: /opt/oauth-mock-linux-arm64

configs:
  oauth_mock_linux_amd64:
    file: ./oauth-mock-linux-amd64
  oauth_mock_linux_arm64:
    file: ./oauth-mock-linux-arm64
