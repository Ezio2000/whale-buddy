name: Package desktop installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to package
        type: choice
        required: true
        default: all
        options:
          - all
          - macos
          - windows

permissions:
  contents: read

env:
  CODEX_RELEASE_TAG: rust-v0.152.0
  CODEX_EXPECTED_VERSION: codex-cli 0.152.0

jobs:
  macos-arm64:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: macos-14
    timeout-minutes: 45
    env:
      CODEX_PACKAGE_ASSET: codex-package-aarch64-apple-darwin.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Verify release tag matches package version
        if: ${{ github.event_name == 'push' }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$package_version"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download official Codex sidecar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .sidecar/archive .sidecar/package
          gh release download "$CODEX_RELEASE_TAG" \
            --repo openai/codex \
            --pattern "$CODEX_PACKAGE_ASSET" \
            --pattern codex-package_SHA256SUMS \
            --dir .sidecar/archive
          grep "  $CODEX_PACKAGE_ASSET$" .sidecar/archive/codex-package_SHA256SUMS \
            > .sidecar/archive/expected.sha256
          (cd .sidecar/archive && shasum -a 256 -c expected.sha256)
          tar -xzf ".sidecar/archive/$CODEX_PACKAGE_ASSET" -C .sidecar/package
          chmod +x .sidecar/package/bin/codex .sidecar/package/bin/codex-code-mode-host
          echo "WHALE_CODEX_BIN=$GITHUB_WORKSPACE/.sidecar/package/bin/codex" >> "$GITHUB_ENV"
          echo "WHALE_CODEX_REVISION=$CODEX_RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Verify official Codex sidecar
        run: |
          version="$($WHALE_CODEX_BIN --version)"
          test "$version" = "$CODEX_EXPECTED_VERSION"
          test -x "$(dirname "$WHALE_CODEX_BIN")/codex-code-mode-host"
          file "$WHALE_CODEX_BIN" | grep -q 'arm64'
          file "$(dirname "$WHALE_CODEX_BIN")/codex-code-mode-host" | grep -q 'arm64'

      - run: pnpm protocol:generate
      - run: pnpm sidecar:check
      - run: pnpm plugins:build
      - run: pnpm typecheck
      - run: pnpm platform:check
      - run: pnpm test
      - run: pnpm exec electron-forge make --platform=darwin --arch=arm64

      - name: Verify bundled marketplaces
        run: |
          test -f "out/Whale Buddy-darwin-arm64/Whale Buddy.app/Contents/Resources/office/.agents/plugins/marketplace.json"
          test -f "out/Whale Buddy-darwin-arm64/Whale Buddy.app/Contents/Resources/office/plugins/whale-office-assistant/ui/index.html"
          test -f "out/Whale Buddy-darwin-arm64/Whale Buddy.app/Contents/Resources/aihub/.agents/plugins/marketplace.json"
          test -f "out/Whale Buddy-darwin-arm64/Whale Buddy.app/Contents/Resources/aihub/plugins/xiaojing-knowledge-base/ui/index.html"

      - name: Verify macOS ad-hoc signature
        run: |
          app="out/Whale Buddy-darwin-arm64/Whale Buddy.app"
          test -d "$app"
          codesign --verify --deep --strict --verbose=4 "$app"
          details="$(codesign -dvvv "$app" 2>&1)"
          signature="$(printf '%s\n' "$details" | sed -n 's/^Signature=//p')"
          test "$signature" = "adhoc"
          if printf '%s\n' "$details" | grep -q 'flags=.*runtime'; then
            echo "Hardened Runtime is incompatible with certificate-free ad-hoc signing"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Whale-Buddy-macOS-arm64
          path: out/make/*.dmg
          if-no-files-found: error

  windows-x64:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CODEX_PACKAGE_ASSET: codex-package-x86_64-pc-windows-msvc.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Verify release tag matches package version
        if: ${{ github.event_name == 'push' }}
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Release tag $env:GITHUB_REF_NAME does not match package version $packageVersion"
          }

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download official Codex sidecar
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force .sidecar/archive, .sidecar/package | Out-Null
          gh release download $env:CODEX_RELEASE_TAG `
            --repo openai/codex `
            --pattern $env:CODEX_PACKAGE_ASSET `
            --pattern codex-package_SHA256SUMS `
            --dir .sidecar/archive
          $checksumLine = Get-Content .sidecar/archive/codex-package_SHA256SUMS |
            Where-Object { $_.EndsWith("  $env:CODEX_PACKAGE_ASSET") } |
            Select-Object -First 1
          $checksumMatch = [regex]::Match($checksumLine, '^([0-9a-f]{64})  ')
          if (-not $checksumMatch.Success) {
            throw "Missing official checksum for $env:CODEX_PACKAGE_ASSET"
          }
          $expected = $checksumMatch.Groups[1].Value
          $archive = Join-Path $env:GITHUB_WORKSPACE ".sidecar/archive/$env:CODEX_PACKAGE_ASSET"
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Codex package checksum mismatch: expected=$expected actual=$actual"
          }
          tar -xzf $archive -C .sidecar/package
          "WHALE_CODEX_BIN=$env:GITHUB_WORKSPACE/.sidecar/package/bin/codex.exe" |
            Out-File -FilePath $env:GITHUB_ENV -Append
          "WHALE_CODEX_REVISION=$env:CODEX_RELEASE_TAG" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify official Codex sidecar
        shell: pwsh
        run: |
          $version = (& $env:WHALE_CODEX_BIN --version).Trim()
          if ($version -ne $env:CODEX_EXPECTED_VERSION) {
            throw "Unexpected Windows Codex version: $version"
          }
          $hostPath = Join-Path (Split-Path $env:WHALE_CODEX_BIN) "codex-code-mode-host.exe"
          if (-not (Test-Path $hostPath)) {
            throw "Missing Windows Code Mode host: $hostPath"
          }

      - run: pnpm protocol:generate
      - run: pnpm sidecar:check
      - run: pnpm plugins:build
      - run: pnpm typecheck
      - run: pnpm platform:check
      - run: pnpm test
      - run: pnpm exec electron-forge make --platform=win32 --arch=x64

      - name: Verify bundled marketplaces
        shell: pwsh
        run: |
          $office = "out/Whale Buddy-win32-x64/resources/office"
          $aihub = "out/Whale Buddy-win32-x64/resources/aihub"
          if (-not (Test-Path "$office/.agents/plugins/marketplace.json")) { throw "Missing office marketplace" }
          if (-not (Test-Path "$office/plugins/whale-office-assistant/ui/index.html")) { throw "Missing office plugin UI" }
          if (-not (Test-Path "$aihub/.agents/plugins/marketplace.json")) { throw "Missing AIHub marketplace" }
          if (-not (Test-Path "$aihub/plugins/xiaojing-knowledge-base/ui/index.html")) { throw "Missing knowledge base plugin UI" }

      - uses: actions/upload-artifact@v4
        with:
          name: Whale-Buddy-Windows-x64
          path: out/make/squirrel.windows/x64/*Setup.exe
          if-no-files-found: error

  publish-release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [macos-arm64, windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Whale-Buddy-*
          path: release-artifacts
          merge-multiple: true

      - name: Stage distributable files
        run: |
          mkdir release-files
          find release-artifacts -type f \
            \( -name '*.dmg' -o -name '*Setup.exe' \) \
            -print0 \
            | while IFS= read -r -d '' source; do
                target="release-files/$(basename "$source")"
                test ! -e "$target"
                cp "$source" "$target"
              done

      - name: Create checksums
        run: |
          cd release-files
          find . -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' files < <(find release-files -type f -print0 | sort -z)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Whale Buddy $GITHUB_REF_NAME" \
              --generate-notes
          fi
