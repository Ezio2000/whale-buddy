name: CI

on:
  push:
    paths-ignore:
      - README.md
      - docs/**
  pull_request:
    paths-ignore:
      - README.md
      - docs/**

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-source/codex-rs

      - run: pnpm install --frozen-lockfile
      - run: pnpm codex:build
      - run: pnpm protocol:check
      - run: pnpm typecheck
      - run: pnpm platform:check
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm test:package:windows-layout
      - run: pnpm test:smoke
      - run: pnpm build
      - run: pnpm make
