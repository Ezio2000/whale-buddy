name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
    paths-ignore:
      - README.md
      - docs/**
  pull_request:
    paths-ignore:
      - README.md
      - docs/**

# 同一分支连续 push 时取消尚未完成的旧 run，避免堆积。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # Push/PR 只做快速源码验证。sidecar、协议生成、E2E 和安装包构建统一由
    # package.yml 在真实目标平台完成，避免每次 push 重复打包。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm platform:check
      - run: pnpm test
